<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadEase - Reading Made Easy</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5ff;
            margin: 0;
            padding: 20px;
            color: #26334d;
        }

        header {
            text-align: center;
            background: #5267c9;
            color: white;
            padding: 25px;
            border-radius: 15px;
        }

        .container {
            max-width: 800px;
            margin: 25px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #dce3f0;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            box-sizing: border-box;
            font-size: 18px;
            line-height: 1.8;
            border: 2px solid #cbd5f0;
            border-radius: 10px;
            resize: vertical;
        }

        button, select, input {
            padding: 12px;
            margin: 6px 4px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            background: #5267c9;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #3549a5;
        }

        .settings {
            margin-top: 25px;
            padding: 15px;
            background: #f4f6ff;
            border-radius: 10px;
        }

        #message {
            color: #3549a5;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <header>
        <h1>📖 ReadEase</h1>
        <p>Reading made easy for every student</p>
        <p>English • தமிழ் • Tanglish</p>
    </header>

    <main class="container">
        <h2>Smart Reader</h2>
        <p>Paste your text below and let ReadEase read it aloud.</p>

        <textarea id="readerText"
            placeholder="Paste or type your text here..."></textarea>

        <br>

        <label for="language">Reading language:</label>

        <select id="language">
            <option value="en-US">English</option>
            <option value="ta-IN">Tamil</option>
        </select>

        <br>

        <button onclick="readText()">🔊 Read Aloud</button>
        <button onclick="pauseText()">⏸ Pause / Resume</button>
        <button onclick="stopText()">⏹ Stop</button>

        <p id="message" role="status" aria-live="polite"></p>

        <section class="settings">
            <h3>Reading Preferences</h3>

            <button onclick="changeSize(2)">A+ Increase Text</button>
            <button onclick="changeSize(-2)">A- Decrease Text</button>
            <button onclick="changeSpacing()">Change Letter Spacing</button>
            <button onclick="changeBackground()">Change Background</button>
            <button onclick="resetStyle()">Reset Reading Style</button>
        </section>

        <section class="settings">
            <h3>CSE Tech Dictionary</h3>

            <input id="wordInput"
                type="text"
                placeholder="Try DBMS, SQL, CPU...">

            <button onclick="searchWord()">Find Meaning</button>

            <p id="meaning" aria-live="polite"></p>
        </section>

        <section class="settings">
            <h3>Exam Mode</h3>
            <p>Reduce distractions and focus on your reading.</p>
            <button onclick="toggleExamMode()">Enter / Exit Exam Mode</button>
        </section>

        <footer>
            <p>ReadEase | Learn at your own pace 💙</p>
        </footer>
    </main>

    <script>
        let textSize = 18;
        let spaced = false;
        let alternateBackground = false;
        let examMode = false;

        
function readText() {
    const text = document.getElementById("readerText").value.trim();
    const language = document.getElementById("language").value;
    const message = document.getElementById("message");
    const synth = window.speechSynthesis;

    if (!text) {
        message.textContent = "Please enter some text first.";
        return;
    }

    if (!synth || !("SpeechSynthesisUtterance" in window)) {
        message.textContent = "Speech is not supported in this browser.";
        return;
    }

    synth.cancel();

    function speakNow() {
        const voices = synth.getVoices();
        const speech = new SpeechSynthesisUtterance(text);

        speech.lang = language;

        if (language === "ta-IN") {
            const tamilVoice = voices.find(voice =>
                voice.lang.toLowerCase() === "ta-in"
            ) || voices.find(voice =>
                voice.lang.toLowerCase().startsWith("ta")
            );

            if (!tamilVoice) {
                message.textContent =
                    "No Tamil voice is available in your browser. Please enable a Tamil speech voice on your device.";
                return;
            }

            speech.voice = tamilVoice;
        } else {
            const englishVoice = voices.find(voice =>
                voice.lang.toLowerCase() === "en-us"
            ) || voices.find(voice =>
                voice.lang.toLowerCase().startsWith("en")
            );

            if (englishVoice) {
                speech.voice = englishVoice;
            }
        }

        speech.onstart = () => {
            message.textContent = "ReadEase is reading your text...";
        };

        speech.onend = () => {
            message.textContent = "Reading completed!";
        };

        speech.onerror = (event) => {
            message.textContent =
                "Speech error: " + event.error +
                ". Please check your speech settings.";
        };

        synth.speak(speech);
    }

    const voices = synth.getVoices();

    if (voices.length > 0) {
        speakNow();
    } else {
        message.textContent = "Loading speech voices...";

        let attempts = 0;

        const checkVoices = setInterval(() => {
            attempts++;

            if (synth.getVoices().length > 0) {
                clearInterval(checkVoices);
                speakNow();
            } else if (attempts >= 10) {
                clearInterval(checkVoices);
                message.textContent =
                    "Speech voices are unavailable. Please reopen your browser and try again.";
            }
        }, 300);
    }
}

    </script>

</body>
</html>
